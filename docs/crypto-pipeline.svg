<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Flujo del pipeline de criptomonedas</title>
  <desc id="desc">Airflow coordina la descarga, procesamiento, analisis y visualizacion de datos de criptomonedas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#07111f" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#61d4c3"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="55" r="140" fill="#2ec4b6" opacity=".08"/>
  <circle cx="80" cy="390" r="180" fill="#ffbf69" opacity=".07"/>
  <text x="70" y="72" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Crypto Dashboard</text>
  <text x="70" y="104" fill="#a9bed3" font-family="Segoe UI, Arial, sans-serif" font-size="16">Pipeline diario orquestado con Apache Airflow</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="170" width="190" height="130" rx="14" fill="#172a46" stroke="#61d4c3" stroke-width="2"/>
    <text x="155" y="214" text-anchor="middle" fill="#61d4c3" font-size="15" font-weight="700">01 · INGESTA</text>
    <text x="155" y="246" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">CoinGecko API</text>
    <text x="155" y="273" text-anchor="middle" fill="#a9bed3" font-size="13">JSON · top 20</text>

    <rect x="300" y="170" width="190" height="130" rx="14" fill="#172a46" stroke="#61d4c3" stroke-width="2"/>
    <text x="395" y="214" text-anchor="middle" fill="#61d4c3" font-size="15" font-weight="700">02 · PROCESO</text>
    <text x="395" y="246" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Pandas</text>
    <text x="395" y="273" text-anchor="middle" fill="#a9bed3" font-size="13">CSV normalizado</text>

    <rect x="540" y="170" width="190" height="130" rx="14" fill="#172a46" stroke="#ffbf69" stroke-width="2"/>
    <text x="635" y="214" text-anchor="middle" fill="#ffbf69" font-size="15" font-weight="700">03 · ANÁLISIS</text>
    <text x="635" y="246" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Métricas</text>
    <text x="635" y="273" text-anchor="middle" fill="#a9bed3" font-size="13">market cap · cambios</text>

    <rect x="780" y="170" width="190" height="130" rx="14" fill="#172a46" stroke="#ffbf69" stroke-width="2"/>
    <text x="875" y="214" text-anchor="middle" fill="#ffbf69" font-size="15" font-weight="700">04 · SALIDA</text>
    <text x="875" y="246" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Dashboard</text>
    <text x="875" y="273" text-anchor="middle" fill="#a9bed3" font-size="13">PNG · datos JSON</text>
  </g>

  <g stroke="#61d4c3" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M250 235 H292"/>
    <path d="M490 235 H532"/>
    <path d="M730 235 H772"/>
  </g>
  <text x="600" y="365" text-anchor="middle" fill="#a9bed3" font-family="Segoe UI, Arial, sans-serif" font-size="14">Airflow Scheduler  ·  PostgreSQL  ·  Docker Compose</text>
</svg>
