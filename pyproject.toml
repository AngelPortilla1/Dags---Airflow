[project]
name = "crypto-market-etl"
version = "0.1.0"
description = "Pipeline ETL diario de criptomonedas orquestado con Apache Airflow y PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0,<4.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<2.3.0",
    "pandera>=0.18.0,<0.21.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "requests>=2.31.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
